#!/usr/sbin/nft -f
# The container lets in ONLY the reverse proxy, on port 80. Everything else --
# and that means :8080 above all -- is dropped. `inet` covers IPv4 and IPv6
# together; on a network with router advertisements Debian picks up a SLAAC
# address by itself, and that one would otherwise be wide open.
#
# ⚠ Change the two addresses below before you use this file. As it stands it
#   locks you out of your own container.
flush ruleset

define proxy_addr = 10.0.0.2            # the reverse proxy -- the only way in
define admin_net  = 10.0.0.0/24         # where you administer the box from

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # The reverse proxy -- the only source for the site.
        ip  saddr $proxy_addr tcp dport 80 accept

        # Monitoring / administration from the network: ICMP and SSH only.
        ip  saddr $admin_net tcp dport 22 accept
        icmp  type { echo-request } accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-advert } accept
    }
    chain forward { type filter hook forward priority filter; policy drop; }
    chain output  { type filter hook output  priority filter; policy accept; }
}
