# Build the container image and publish it to the GitHub container registry,
# so that the `image:` line in compose.yaml points at something that exists.
#
# ⚠ Nothing here needs a secret of yours: GITHUB_TOKEN is minted per run and is
#   scoped to this repository.
#
# ⚠ Two architectures, and that is not a luxury: the machine a family photo
#   library actually runs on is as likely to be a small ARM box under the
#   stairs as an x86 server. An amd64-only image fails there with "no matching
#   manifest", which reads like a broken image rather than a wrong CPU.
#
# ⚠ Each architecture is built on its OWN runner, natively -- not with QEMU.
#   Emulating arm64 to compile Pillow and friends turns a four-minute build
#   into most of an hour, and a build nobody waits for is a build that silently
#   stops being run.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed WITHOUT a tag, by digest only. The tag is
      # put on the list that joins them, in the job below -- otherwise the two
      # would overwrite each other's `latest` and the last one to finish would
      # win.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      # An empty file whose NAME is the digest -- that is all the merge job
      # needs, and it cannot be confused with the contents of anything.
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Join the two into one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Say what came out
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
