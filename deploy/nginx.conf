# Roamlight — nginx. A worked example of the four locks in front of the app.
#
# ⚠ Three things in here are yours, not mine. Replace them before you use this
#   file, or nothing will work:
#     photos.example.com   the address people type
#     10.0.0.2             the reverse proxy in front of this box (the only
#                          address allowed in)
#     10.0.0.3:9000        the identity provider's outpost (Authentik here)
#
# Anything that is not photos.example.com gets no answer at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;
    server_tokens off;

    # --- Lock 2: ONCE, at the server level. It is inherited by every location
    #     that has no allow/deny of its own -- so a new location is closed by
    #     default. (Repeating allow/deny per location makes "open" the default,
    #     and then forgetting one leaves a hole.)
    allow 10.0.0.2;           # the reverse proxy
    allow 127.0.0.1;
    deny  all;

    # --- Lock 3: ONCE, at the server level -> the default is "closed".
    #     If the outpost is gone this becomes a 500 -- fail-closed. That is on
    #     purpose; the way back in is an SSH tunnel to 127.0.0.1:8080.
    # ⚠ A FIXED address -- `auth_request` does not take a variable. Who is asked
    #   behind it (the outpost, or our own app guard) is decided by the map
    #   `$family_authz_pass` in nginx-http.conf.
    auth_request     /family-authz;
    error_page 401 = @family_unauth;

    # --- The identity comes EXCLUSIVELY from the outpost.
    #     Every header not set here could be sent by the client itself.
    auth_request_set $ak_user   $upstream_http_x_authentik_username;
    auth_request_set $ak_groups $upstream_http_x_authentik_groups;
    auth_request_set $ak_email  $upstream_http_x_authentik_email;
    auth_request_set $ak_uid    $upstream_http_x_authentik_uid;
    auth_request_set $ak_cookie $upstream_http_set_cookie;

    proxy_set_header X-authentik-username $ak_user;
    proxy_set_header X-authentik-groups   $ak_groups;
    proxy_set_header X-authentik-email    $ak_email;
    proxy_set_header X-authentik-uid      $ak_uid;
    proxy_set_header X-authentik-name          "";
    proxy_set_header X-authentik-jwt           "";
    proxy_set_header X-authentik-meta-jwks     "";
    proxy_set_header X-authentik-meta-outpost  "";
    proxy_set_header X-authentik-meta-provider "";
    proxy_set_header X-authentik-meta-app      "";
    proxy_set_header X-authentik-meta-version  "";

    # --- Lock 4: a secret the client does not know. The app refuses without it
    #     -- regardless of whether the authentication above still stands.
    include /etc/nginx/family-proxy-secret.conf;

    # --- Do NOT include proxy_params: it sets X-Forwarded-For to
    #     $proxy_add_x_forwarded_for and appends whatever the client asked for.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    # --- add_header is NOT inherited into a location that has one of its own.
    #     That is why these also stand once more in the app (app/security.py).
    add_header X-Robots-Tag  "noindex, nofollow, noimageindex, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The pages carry names, places and cameras. On a shared computer they
    # should leave nothing behind in the disk cache after signing out.
    add_header Cache-Control "private, no-store" always;
    # ⚠ `style-src` needs 'unsafe-inline': Leaflet positions EVERY tile through
    #   an inline `style` attribute, and without it the map has zero height.
    #   `script-src` stays strict -- and that is the directive that counts: an
    #   injected style can misplace things, an injected script can act.
    # ⚠ tile.openstreetmap.org has to be in img-src: the map takes its tiles
    #   straight from OSM. This CSP comes on top of the app's own -- the browser
    #   enforces both (the stricter one wins), so OSM has to be in BOTH.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 16m;     # 5 MB chunks + overhead, never a whole RAW
    client_body_timeout  300s;

    # ⚠ Static files without authentication: the share page is shown to a guest
    # who has no account. Without this they got a 302 to the sign-in page for
    # the CSS -- the page arrived with no layout and the upload did not load at
    # all. **No photograph** lives here: stylesheet, fonts, scripts.
    location /static/ {
        auth_request off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /robots.txt {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- Images: a CDN caches by extension, and a zone rule "cache everything"
    #     overrides the origin's header. Hence all three levels -- and, on top
    #     of that, a cache rule "photos.example.com -> bypass cache".
    location /tiles/ {
        # A client gone mad would otherwise have the server download the whole
        # world -- and OSM would block our user agent.
        limit_req zone=family_tiles burst=60 nodelay;
        add_header Cache-Control "private, max-age=604800" always;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~* ^/(photos|thumbs|media)/ {
        # `private` means: ONLY the browser of the family member who is
        # looking. No shared cache, no proxy, and the CDN gets its own
        # instruction right underneath. `no-store` was too much: with it EVERY
        # page view pulled every photograph again, the second time too, and on
        # going back. The photograph is shown on the device anyway -- leaving it
        # there is not a new way out.
        # The address carries ?v=<rev>, so a rotated photograph is still fetched
        # again straight away (see register.rotate).
        add_header Cache-Control                "private, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control            "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- The ONLY exceptions to the authentication ---------------------------
    # allow/deny is NOT redefined here -> it is inherited from the server level.
    #
    # ⚠ The images and videos behind a share link get THEIR OWN, wide limit
    # (family_share_assets) -- a collection has dozens of photographs, and the
    # browser asks for all of them at once. This regex location stands BEFORE
    # the `/s/` prefix location, so the images do not fall into the narrow
    # password brake.
    location ~ "^/s/[A-Za-z0-9_-]{16,64}/(img|video)/" {
        auth_request off;
        access_log off;
        limit_req zone=family_share_assets burst=200 nodelay;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
    }

    # "Download all": the whole album as a zip. The zip is built on the spot
    # (a GPS strip for every photograph), which takes time -- hence a long read
    # timeout.
    location ~ "^/s/[A-Za-z0-9_-]{16,64}/all\.zip$" {
        auth_request off;
        access_log off;
        limit_req zone=family_share_assets burst=5 nodelay;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        client_max_body_size 64k;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8080;
    }

    location /s/ {
        auth_request off;
        # The token is in the address. It should not be in every line of the log.
        access_log off;
        limit_req zone=family_share burst=5 nodelay;
        add_header Referrer-Policy "no-referrer" always;    # the token is in the URL
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        # ⚠ 64 kB for the share page itself. Only a password is sent there.
        # This used to be 256 MB for the WHOLE `/s/` path, and with that anybody
        # could send a few hundred MB to an address that does not exist at all
        # -- the server would have taken it and only then said 404.
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
    }

    # Only the upload path may be large. A RAW file is 50 MB before you know it.
    # The number of files and the total size are limited by the app (per link
    # and globally); this is only the single file.
    # ⚠ The regex is in quotation marks: otherwise nginx reads `{16,64}` as the
    # start of a block and fails with "unknown directive".
    location ~ "^/s/[A-Za-z0-9_-]{16,64}/upload$" {
        auth_request off;
        limit_req zone=family_share burst=2 nodelay;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        client_max_body_size 256m;
        client_body_timeout 300s;
        proxy_request_buffering off;      # do not write it all to disk first
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/health {
        auth_request off;
        proxy_pass http://127.0.0.1:8080;
    }

    # --- The app --------------------------------------------------------------
    # THE guard. One path for both: the identity provider's outpost or our own
    # token check -- the map in nginx-http.conf says which.
    location = /family-authz {
        internal;
        auth_request off;
        proxy_pass $family_authz_pass;
        proxy_set_header Host            photos.example.com;
        proxy_set_header X-Original-URL  https://photos.example.com$request_uri;
        # The identity provider needs the real client address for its brute-force policy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ⚠ The proxy secret is given ONLY to our own guard, not to the outpost
        #   -- the map `$family_authz_secret` (written by install.sh, because
        #   the value is in it) is set for a token and empty otherwise. The
        #   outpost should not get a key it does not need.
        proxy_set_header X-Family-Proxy  $family_authz_secret;
        # ⚠ In this sub-request ONLY the `Authorization` header carries the
        #   identity. Whatever the client brings along in identity headers is
        #   wiped here -- otherwise a claim of its own would slip through.
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups   "";
        proxy_set_header X-authentik-email    "";
        proxy_set_header X-authentik-uid      "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Nobody has any business there from outside -- the path is used ONLY as a
    # sub-request.
    location = /api/app/authz { return 404; }

    # 401: a browser is sent to the sign-in page, an app gets a plain 401.
    # (`if` with `return` -- the one use of `if` that is not dangerous.)
    location @family_unauth {
        internal;
        if ($http_authorization ~* "^Bearer\s+fam_") { return 401; }
        add_header Set-Cookie $ak_cookie;
        return 302 https://photos.example.com/outpost.goauthentik.io/start?rd=https://photos.example.com$request_uri;
    }

    # Pairing: the ONE thing the app may do without a token. Locked by the
    # pairing code itself (five minutes, one use) plus a rate limit.
    location = /api/app/pair {
        auth_request off;
        limit_req zone=family_pair burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # --- The identity provider's outpost --------------------------------------
    location /outpost.goauthentik.io {
        internal;
        auth_request off;
        proxy_pass http://10.0.0.3:9000/outpost.goauthentik.io/auth/nginx;
        proxy_set_header Host            photos.example.com;
        proxy_set_header X-Original-URL  https://photos.example.com$request_uri;
        # ⚠ Here -- and ONLY here -- the chain is passed on. The app gets
        #   $remote_addr (which cannot be forged); the identity provider needs
        #   the real client address for its brute-force policy and its sign-in
        #   log, or it would see every sign-in as coming from the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
    location /outpost.goauthentik.io/ {
        auth_request off;
        proxy_pass http://10.0.0.3:9000/outpost.goauthentik.io/;
        proxy_set_header Host photos.example.com;
        add_header Set-Cookie $ak_cookie;
    }

    location ~ /\. { deny all; }
}
