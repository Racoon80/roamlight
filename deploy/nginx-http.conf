# Goes into /etc/nginx/conf.d/ — it needs the http context.
#
# ⚠ One address in here is yours: the identity provider's outpost (10.0.0.3:9000
#   below). install.sh substitutes it from FAMILY_OUTPOST when that is set.

# The brake for share links: PER TOKEN, not per address. A client address can be
# forged; the token in the URL cannot.
map $request_uri $family_share_token {
    default "";
    "~^/s/(?<t>[A-Za-z0-9_-]+)" $t;
}
limit_req_zone $family_share_token zone=family_share:10m rate=20r/m;
limit_req_status 429;

# ⚠ Image and video requests behind a share link need THEIR OWN, wide limit: a
# shared collection has dozens of photographs and the browser asks for all of
# them at once. The 20r/m brake above is for the password page (brute force) --
# applied to the images it gave a 429 after the first few, and the photographs
# came out broken. Braked per token, but generously.
limit_req_zone $family_share_token zone=family_share_assets:10m rate=1200r/m;

# The tile brake. A map makes ~20 requests when it opens, hence a burst.
limit_req_zone $binary_remote_addr zone=family_tiles:10m rate=240r/m;

# ---------------------------------------------------------------------------
#  The app (iPhone/iPad). See app/devices.py.
# ---------------------------------------------------------------------------
# ⚠ Who supplies the identity is decided PER REQUEST. If an
# `Authorization: Bearer fam_…` comes along, nginx asks our own guard, otherwise
# the identity provider's outpost, as before. So not one of the site's routes
# has to change, and on both roads the headers come from a source the client
# cannot write.
#
# ⚠⚠ **`auth_request` does NOT take a variable.** That was the first version,
#    and nginx took `$family_authz` as a FILE NAME:
#      open() "/usr/share/nginx/html$family_authz" failed (2: No such file)
#    `proxy_pass` does take one -- so the guard's address is fixed
#    (`/family-authz`) and the TARGET behind it is the variable. Because these
#    are addresses and not names, no `resolver` is needed either.
map $http_authorization $family_authz_pass {
    default              http://10.0.0.3:9000/outpost.goauthentik.io/auth/nginx;
    "~*^Bearer\s+fam_"   http://127.0.0.1:8080/api/app/authz;
}

# Pairing: guessing a code is hopeless at 192 bits anyway, but a brake costs
# nothing. Per address, because no token exists yet at that point.
limit_req_zone $binary_remote_addr zone=family_pair:1m rate=10r/m;
